<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICTETL 2025 Souvenir</title>
<style>
body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    display: flex;
    justify-content: flex-start;
    align-items: center;
    height: 100vh;
    flex-direction: column;
    overflow: hidden;
    position: relative;
}

/* Background image with mild blur */
body::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: url('hero.jpg') no-repeat center center;
    background-size: cover;
    filter: blur(2px) brightness(0.7);
    z-index: 0;
}

/* Watermark */
body::after {
    content: "ICTETL 2025 BSA Crescent - CDOE";
    position: absolute;
    top: 60%;
    left: 60%;
    transform: translate(-50%, -50%) rotate(-30deg);
    font-size: 5rem;
    color: rgba(255,255,255,0.1);
    white-space: nowrap;
    pointer-events: none;
    z-index: 1;
}

/* Ribbon knot at top */
.ribbon {
    position: relative;
    background: #e74c3c;
    color: white;
    padding: 15px 40px;
    font-size: 1.8rem;
    font-weight: bold;
    border-radius: 10px 10px 0 0;
    margin-bottom: 20px;
    text-align: center;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    z-index: 2;
    transition: all 0.5s ease;
}

.container {
    position: relative;
    display: flex;
    flex-direction: column; /* Stack video and button */
    align-items: center;
    justify-content: flex-start;
    padding: 30px;
    margin-top: 80px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    background: linear-gradient(145deg, #fff1f0, #fcefee);
    max-width: 800px;
    z-index: 2;
    transition: all 0.5s ease;
}
/* Video styling */
.cover-video {
    width: 100%;
    max-width: 600px;
    max-height: 400px;
    height: auto;
    border-radius: 10px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    margin-bottom: 20px; /* space between video and button */
    object-fit: cover;   /* maintain aspect ratio and cover box */
}

/* Cover image */
.cover-image {
    width: 100%;
    max-width: 600px;
    max-height: 400px;
    height: auto;
    object-fit: contain;
    border-radius: 10px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    margin-bottom: 20px;
}

/* Button */
button {
    background-color: #f39c12;
    color: white;
    border: none;
    padding: 15px 35px;
    font-size: 1.1rem;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.3s, background 0.3s;
}

button:hover {
    background-color: #e67e22;
    transform: scale(1.05);
}

/* Full-page flipbook */
.full-flipbook {
    width: 100vw;
    height: 100vh;
    max-width: 100%;
    max-height: 100%;
    border: none;
    border-radius: 0;
    padding: 0;
    margin: 0;
}

/* Confetti */
.confetti {
    position: absolute;
    width: 10px;
    height: 10px;
    opacity: 0.8;
    z-index: 9999;
    pointer-events: none;
    animation: fall 3s linear infinite;
}

@keyframes fall {
    0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
}
/* Media Queries for smaller devices */
@media screen and (max-width: 768px) {
    .container {
        margin-top: 30px;
        padding: 15px;
    }
    .cover-video {
        max-width: 100%;
        max-height: 300px;
    }
    button {
        padding: 10px 25px;
        font-size: 0.9rem;
    }
}

@media screen and (max-width: 480px) {
    .container {
        margin-top: 20px;
        padding: 10px;
    }
    .cover-video {
        max-width: 100%;
        max-height: 200px;
    }
    button {
        padding: 8px 20px;
        font-size: 0.85rem;
    }
}
</style>
</head>
<body>
<div class="ribbon" id="ribbon">🎀 ICTETL - 2025 Souvenir 🎀</div>

<div class="container" id="container">
    <!-- Video Cover -->
    <video class="cover-video" autoplay muted loop playsinline>
        <source src="cover_video.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <!-- Open button -->
    <button id="openBtn" onclick="launchFlipbook()">Open Souvenir</button>
</div>

<script>
let confettiInterval;

function launchFlipbook() {
    const video = document.querySelector('.cover-video');
    video.muted = false;  // unmute
    video.volume = 1;     // set full volume
    // Hide button and ribbon
    document.getElementById('openBtn').style.display = 'none';
    document.getElementById('ribbon').style.display = 'none';

    // Make container full width/height
    const container = document.getElementById('container');
    container.style.width = '100vw';
    container.style.height = '100vh';
    container.style.margin = '0';
    container.style.borderRadius = '0';
    container.style.padding = '0';
    container.style.display = 'flex';
    container.style.justifyContent = 'center';
    container.style.alignItems = 'center';

    // Remove previous content
    container.innerHTML = '';

    // Add flipbook iframe
    const flipbook = document.createElement('iframe');
    flipbook.src = "https://heyzine.com/flip-book/c9c3576f6b.html"; // Replace with your flipbook URL
    flipbook.classList.add('full-flipbook');
    container.appendChild(flipbook);

    // Start continuous confetti
    confettiInterval = setInterval(createConfetti, 200);
}

function createConfetti() {
    const confetti = document.createElement('div');
    confetti.classList.add('confetti');
    confetti.style.backgroundColor = `hsl(${Math.random()*360}, 70%, 50%)`;
    confetti.style.left = Math.random() * window.innerWidth + 'px';
    confetti.style.animationDuration = (3 + Math.random() * 3) + 's';
    confetti.style.width = confetti.style.height = (5 + Math.random() * 12) + 'px';
    document.body.appendChild(confetti);
    setTimeout(() => confetti.remove(), 4000);
}
</script>
</body>
</html>
